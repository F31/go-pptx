name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # CORE-01 建仓首批 CI 补完（CORE-01-lint）。
  # - gofmt -l . 检测未格式化文件；零输出=通过。
  # - go vet 在默认与 corpus 两种 build tag 下分别跑一遍，确保 fuzz/corpus
  #   代码路径的源码也走静态检查。
  # - 不引入 staticcheck/golangci-lint 等额外依赖，避免 CI 拉取体积与
  #   维护成本上升；待 lint 规则稳定后再视情追加。
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: gofmt check (no diff)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::The following files are not gofmt-compliant:"
            gofmt -l .
            exit 1
          fi
      - name: go vet (default build tags)
        run: go vet ./...
      - name: go vet (corpus build tags)
        run: go vet -tags=corpus ./...

  test:
    name: test-${{ matrix.os }}-go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.24.x', '1.27.x']
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: WASM compile check (pure-Go constraint regression, V2.6 §26)
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go build ./...

  race:
    name: race
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test with race detector
        run: go test -race ./...

  # CORPUS-01 公开样本金样自动 replay 守门（QA-01）。
  # - 默认 `go test ./...` 不跑 corpus 测试（见 build tag `corpus`）；
  # - 本 job 显式启用 build tag，让 CI 跑通 testdata/corpus/s00* 三份
  #   公开样本与 ext-0024（私有样本在本机无源时自动 SKIP，不阻断）。
  # - 前置 validate 步骤确保 manifest.json/actions.json 约定一致；测试
  #   才有可能跑通，反之亦然——manifest 损坏是数据层错，先于测试报错更直观。
  # - 详细日志 + 失败归档便于排查（公开样本用例的 skip/pass 计数有诊断价值）。
  corpus-replay:
    name: corpus-replay
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Validate corpus manifests (scripts/gen_corpus validate)
        run: scripts/gen_corpus/run.sh validate testdata/corpus
      - name: Build (corpus tag)
        run: go build -tags=corpus ./...
      - name: Vet (corpus tag)
        run: go vet -tags=corpus ./...
      - name: Test (corpus tag, verbose)
        run: go test -tags=corpus -v ./... | tee corpus-replay.log
      - name: Upload corpus replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-replay-log
          path: corpus-replay.log
          if-no-files-found: ignore
          retention-days: 14

  perf-smoke:
    name: perf-smoke
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      # PERF-01 确定性守门：基准套件跑一遍 + 报告生成器可解析 + 语料尺寸下界。
      # 不做 ns/op 阈值断言——共享 runner 抖动大，时序门禁必然 flaky（理由见
      # docs/PERF-01-性能基线.md §9）。夜间全量基线见 .github/workflows/perf.yml。
      - name: PERF-01 smoke guard
        run: RAW=perf-smoke.log sh scripts/perf/smoke.sh
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-log
          path: perf-smoke.log
          if-no-files-found: ignore
          retention-days: 14

  # V2.6 §26 P1：纯 Go（CGO=0）跨平台编译验证。RELEASE-NOTES-v1.0.0 宣称的
  # 四档交叉构建在此固化（此前仅本地验收清单覆盖；darwin/arm64 由 macos-latest
  # 原生 job 覆盖，此处仍显式列出以独立于 runner 代际变化）。
  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: js
            goarch: wasm
          - goos: darwin
            goarch: arm64
          - goos: wasip1
            goarch: wasm
          - goos: linux
            goarch: arm64
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
