name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.os }}-go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.24.x', '1.27.x']
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: WASM compile check (pure-Go constraint regression, V2.6 §26)
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go build ./...

  race:
    name: race
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test with race detector
        run: go test -race ./...

  corpus-replay:
    name: corpus-replay
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build (corpus tag)
        run: go build -tags=corpus ./...
      - name: Vet (corpus tag)
        run: go vet -tags=corpus ./...
      - name: Test (corpus tag)
        run: go test -tags=corpus ./...
